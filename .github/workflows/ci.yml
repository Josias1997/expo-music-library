name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies from the committed lock
        run: bun install --frozen-lockfile

      - name: Verify the Expo 57 example lock
        working-directory: example
        run: npm ci --ignore-scripts

      - name: Lint, test, build, typecheck, and inspect the npm tarball
        run: bun run check

      - name: Build and verify the exact release artifact
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          mkdir npm-artifact
          npm pack --ignore-scripts --pack-destination npm-artifact
          VERSION="$(node -p 'require("./package.json").version')"
          ARTIFACT="npm-artifact/expo-music-library-${VERSION}.tgz"
          test -f "$ARTIFACT"
          node scripts/verify-package.cjs "$ARTIFACT"

      - name: Preserve the verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: npm-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android · Expo ${{ matrix.sdk }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ["55", "56", "57"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.1"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: npm-artifact

      - name: Configure Expo compatibility fixture
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          ARTIFACT="npm-artifact/expo-music-library-${VERSION}.tgz"
          test -f "$ARTIFACT"
          node scripts/configure-example-sdk.cjs "${{ matrix.sdk }}" "$ARTIFACT"

      - name: Install fixture dependencies
        working-directory: example
        run: npm ci --ignore-scripts

      - name: Typecheck the packed public API
        working-directory: example
        run: npm run typecheck

      - name: Verify Expo dependency alignment
        working-directory: example
        run: ./node_modules/.bin/expo install --check

      - name: Generate Android project
        working-directory: example
        run: npm run prebuild:android

      - name: Compile app and native module
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

  ios:
    name: iOS · Expo ${{ matrix.sdk }}
    needs: package
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sdk: ["55", "56", "57"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.1"

      - name: Restore the verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: npm-artifact

      - name: Configure Expo compatibility fixture
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          ARTIFACT="npm-artifact/expo-music-library-${VERSION}.tgz"
          test -f "$ARTIFACT"
          node scripts/configure-example-sdk.cjs "${{ matrix.sdk }}" "$ARTIFACT"

      - name: Install fixture dependencies
        working-directory: example
        run: npm ci --ignore-scripts

      - name: Typecheck the packed public API
        working-directory: example
        run: npm run typecheck

      - name: Verify Expo dependency alignment
        working-directory: example
        run: ./node_modules/.bin/expo install --check

      - name: Generate iOS project
        working-directory: example
        run: npm run prebuild:ios

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      - name: Compile app and native module
        run: >-
          xcodebuild
          -workspace example/ios/example.xcworkspace
          -scheme example
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
